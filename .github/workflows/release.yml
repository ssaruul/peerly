name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout 600s ./...
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: make server-arm64 server-amd64 installer cli VERSION=${GITHUB_REF_NAME#v}
      - run: |
          cd dist
          cp -r ../deploy .
          tar -czf peerly-server-deploy.tar.gz deploy
          sha256sum peerly-setup.exe peerly.exe peerly-browser.exe peerly-cli.exe peerly-server-linux-arm64 peerly-server-linux-amd64 peerly-server-deploy.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/peerly-setup.exe
            dist/peerly.exe
            dist/peerly-browser.exe
            dist/peerly-cli.exe
            dist/peerly-server-linux-arm64
            dist/peerly-server-linux-amd64
            dist/peerly-server-deploy.tar.gz
            dist/SHA256SUMS.txt
          body: |
            Players: download and run `peerly-setup.exe`. It installs peerly for you only (no administrator rights needed) and adds it to the Start menu, so searching for peerly finds it. Windows will warn about an unknown program; choose More info, then Run anyway. `peerly.exe` is the same app without installing, and `peerly-browser.exe` runs it in your web browser.

            Server: download `peerly-server-linux-arm64` (Oracle ARM, Raspberry Pi) or `peerly-server-linux-amd64`, plus `peerly-server-deploy.tar.gz` for `install.sh`, the service file and the Caddyfile. See the README.
